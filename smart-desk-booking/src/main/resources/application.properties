spring.application.name=smart-desk-booking

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/smartdesk
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# --- Flyway Database Migrations ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Redis ---
spring.data.redis.host=localhost
spring.data.redis.port=6379

# --- JWT Configuration ---
# Secret key for signing JWT tokens (must be at least 32 characters for HMAC-SHA256)
# WARNING: In production, load this from environment variables, not from this file!
jwt.secret=SmartDeskBookingSecretKey2026MustBeAtLeast32Characters
# Token expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration-ms=86400000

# --- Actuator & Metrics ---
# Expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
