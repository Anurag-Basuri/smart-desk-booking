spring.application.name=smart-desk-booking

# Default active profile for local development
# Loads application-local.properties (ignored by Git)
spring.profiles.active=local

# PostgreSQL Configuration (Default / Environment Variables)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smart_desk_booking}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway Database Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Redis Configuration (Default / Environment Variables)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# JWT Configuration
# Secret key for signing JWT tokens (must be at least 32 characters for HMAC-SHA256)
jwt.secret=${JWT_SECRET:SmartDeskBookingSecretKey2026MustBeAtLeast32Characters}
# Token expiration: 24 hours in milliseconds (24 * 60 * 60 * 1000)
jwt.expiration-ms=86400000

# Actuator & Metrics
# Expose health, info, metrics, and prometheus endpoints
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.tags.application=${spring.application.name}
